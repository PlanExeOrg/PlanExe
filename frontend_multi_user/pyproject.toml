[project]
name = "PlanExe-frontend-multiuser"
version = "0.1.0"
description = "Running PlanExe on Railway"
requires-python = ">=3.13"
dependencies = [
    "flask==3.1.3",
    "flask-admin==2.2.0",
    "flask-login==0.6.3",
    "flask-sqlalchemy==3.1.1",
    "flask-wtf==1.3.0",
    "authlib==1.7.2",
    "psycopg2-binary==2.9.12",
    "requests==2.34.2",
    "stripe==15.5.1",
    "python-dotenv==1.2.3",
    "sqlalchemy-utils==0.42.1",
    "WTForms==3.2.2", # This is an older version of WTForms. Since WTForms 3.2.1 breaks the "edit" button in the admin panel.
    "gunicorn==26.2.0"
] 

[build-system]
requires = ["setuptools>=82.0.1", "wheel"]
build-backend = "setuptools.build_meta"
