      "custom_tooltip": "<b>Identify and vet potential regional franchise partners</b><br>Research and screen prospective regional operators based on market reach and operational capability criteria to ensure alignment with brand standards before formal engagement.<br><b>Resources needed:</b><br><ul><li>Market Analyst</li><li>Business Development Manager</li><li>Legal Counsel</li></ul>",
      "start_date": "2027-01-20",
      "duration": 9.0,
      "progress": 0,
      "open": true,

    {
      "id": "40ffea50-b049-4170-ae34-f2e202aac48a",
      "text": "Develop financial viability and safety compliance documentation",
      "custom_tooltip": "<b>Develop financial viability and safety compliance documentation</b><br>Compile detailed business case reports including CAPEX breakdowns, ROI projections, and FAA Part 107 certification proof to address partner risk concerns regarding sustainability.<br><b>Resources needed:</b><br><ul><li>CFO</li><li>Regulatory &amp; Compliance Director</li><li>Financial Analyst</li></ul>",
      "start_date": "2027-01-29",
      "duration": 9.0,
      "progress": 0,
      "open": true,
      "meta": "69380bd3-38e8-4eb3-aa3e-fc7b4d0e7dff FS",
      "parent": "10b68b59-adc1-408e-8250-e8d7befb12a1"
    },
    {
      "id": "2bbbee89-5a2c-49ed-980b-bdba0ef5521c",
      "text": "Present business viability evidence to potential partners",
      "custom_tooltip": "<b>Present business viability evidence to potential partners</b><br>Schedule and conduct pitch meetings where financial models and safety protocols are reviewed with stakeholders to build trust and demonstrate operational readiness for expansion.<br><b>Resources needed:</b><br><ul><li>Revenue &amp; Franchise Director</li><li>Marketing Strategist</li><li>Operations Lead</li></ul>",
      "start_date": "2027-02-07",
      "duration": 9.0,
      "progress": 0,
      "open": true,
      "meta": "40ffea50-b049-4170-ae34-f2e202aac48a FS",
      "parent": "10b68b59-adc1-408e-8250-e8d7befb12a1"
    },
    {
      "id": "878df2c5-ecbf-48c8-b449-2b75a40ec0b3",
      "text": "Finalize agreements and collect signed non-binding LOIs",
      "custom_tooltip": "<b>Finalize agreements and collect signed non-binding LOIs</b><br>Review terms of engagement drafts with interested parties and obtain formal letters of intent confirming commitment to regional development without binding financial obligations yet.<br><b>Resources needed:</b><br><ul><li>Legal Counsel</li><li>Revenue &amp; Franchise Director</li><li>Partner Relations Manager</li></ul>",
      "start_date": "2027-02-16",
      "duration": 9.0,
      "progress": 0,
      "open": true,

    {
      "id": "b3801889-e477-4c01-a004-f010c629f267",
      "text": "Complete staff certification training programs for instructors",
      "custom_tooltip": "<b>Complete staff certification training programs for instructors</b>",

      "parent": "1fa30365-74e6-46c7-ac4a-d14d9d2f1d52",

    {
      "id": "3952cf3c-edb1-4b0b-91e1-dc5b799442d8",
      "text": "Enroll instructors in accelerated training cohorts",
      "custom_tooltip": "<b>Enroll instructors in accelerated training cohorts</b><br>Identify eligible staff members and register them for immediate FAA Part 107 preparation courses to meet opening deadlines.<br><b>Resources needed:</b><br><ul><li>Training Coordinator</li><li>HR Manager</li><li>FAA Course Provider</li></ul>",
      "start_date": "2027-02-25",
      "duration": 5.0,

      "meta": "b3801889-e477-4c01-a004-f010c629f267 SS",

    {
      "id": "ed687329-7160-424f-afcf-9a41261ce3c6",
      "text": "Schedule FAA certification exams with buffer time",
      "custom_tooltip": "<b>Schedule FAA certification exams with buffer time</b><br>Coordinate exam dates with testing centers ensuring sufficient lead time before the venue launch date to avoid delays.<br><b>Resources needed:</b><br><ul><li>Operations Manager</li><li>Testing Center Administrator</li><li>Certification Tracking Software</li></ul>",
      "start_date": "2027-03-02",
      "duration": 5.0,
      "progress": 0,
      "open": true,
      "meta": "3952cf3c-edb1-4b0b-91e1-dc5b799442d8 FS",
      "parent": "b3801889-e477-4c01-a004-f010c629f267"
    },
    {
      "id": "2e9be244-9283-46f1-840c-4fc9f048e269",
      "text": "Verify operational readiness via practical assessments",
      "custom_tooltip": "<b>Verify operational readiness via practical assessments</b><br>Conduct flight proficiency checks and safety protocol evaluations to confirm all instructors meet competency standards prior to public opening.<br><b>Resources needed:</b><br><ul><li>Senior Flight Instructor</li><li>Safety Officer</li><li>Assessment Checklist</li></ul>",
      "start_date": "2027-03-07",
      "duration": 5.0,
      "progress": 0,
      "open": true,

      "parent": "b3801889-e477-4c01-a004-f010c629f267"
    },
    {
      "id": "d260ec68-9ab8-4407-9c49-89805361683e",
      "text": "Conduct final safety audits and compliance inspections",
      "custom_tooltip": "<b>Conduct final safety audits and compliance inspections</b>",
      "progress": 0,
      "open": true,
      "meta": "b3801889-e477-4c01-a004-f010c629f267 FS",

    {
      "id": "a0bb09c6-ab2c-4645-8ca2-14f56260080e",
      "text": "Prepare internal compliance documentation package",
      "custom_tooltip": "<b>Prepare internal compliance documentation package</b><br>Compile all safety logs, HVAC test results, and network security audit reports required by regulatory bodies prior to official review.<br><b>Resources needed:</b><br><ul><li>Safety Operations Lead</li><li>Compliance Director</li><li>Document Management System</li></ul>",
      "start_date": "2027-03-12",
      "duration": 3.0,
      "progress": 0,
      "open": true,
      "meta": "d260ec68-9ab8-4407-9c49-89805361683e SS",
      "parent": "d260ec68-9ab8-4407-9c49-89805361683e"
    },
    {
      "id": "8e147ad0-e30e-4fbe-a110-d702b8dd6dee",
      "text": "Schedule regulatory body inspections and audits",
      "custom_tooltip": "<b>Schedule regulatory body inspections and audits</b><br>Contact FAA inspectors, Fire Department officials, and local zoning authorities to secure dates for final venue clearance inspections within the timeline.<br><b>Resources needed:</b><br><ul><li>Regulatory &amp; Compliance Director</li><li>Venue Manager</li><li>External Auditors</li></ul>",
      "start_date": "2027-03-15",
      "duration": 3.0,
      "progress": 0,
      "open": true,
      "meta": "a0bb09c6-ab2c-4645-8ca2-14f56260080e FS",
      "parent": "d260ec68-9ab8-4407-9c49-89805361683e"
    },
    {
      "id": "4c712fa1-c555-4c32-a7ae-baa6406747b1",
      "text": "Execute physical safety walkthroughs and checks",
      "custom_tooltip": "<b>Execute physical safety walkthroughs and checks</b><br>Perform on-site verification of ballistic netting, emergency stop zones, and ventilation systems against established safety standards during scheduled inspection windows.<br><b>Resources needed:</b><br><ul><li>Safety Operations Lead</li><li>Facility Engineers</li><li>Fire Safety Officer</li></ul>",
      "start_date": "2027-03-18",
      "duration": 3.0,
      "progress": 0,
      "open": true,
      "meta": "8e147ad0-e30e-4fbe-a110-d702b8dd6dee FS",
      "parent": "d260ec68-9ab8-4407-9c49-89805361683e"
    },
    {
      "id": "6eee7fd0-b024-4bde-b523-66027ee91b2f",
      "text": "Remediate identified non-compliance findings",
      "custom_tooltip": "<b>Remediate identified non-compliance findings</b><br>Address any deficiencies flagged during inspections immediately through repairs or procedural changes to ensure full regulatory compliance before launch approval.<br><b>Resources needed:</b><br><ul><li>Maintenance Crew</li><li>Safety Operations Lead</li><li>Procurement Team</li></ul>",
      "start_date": "2027-03-21",
      "duration": 3.0,
      "progress": 0,
      "open": true,
      "meta": "4c712fa1-c555-4c32-a7ae-baa6406747b1 FS",
      "parent": "d260ec68-9ab8-4407-9c49-89805361683e"
    },
    {
      "id": "9ed9e473-c0c4-4772-a9e5-a250ed45c045",
      "text": "Secure final operational sign-off certificates",
      "custom_tooltip": "<b>Secure final operational sign-off certificates</b><br>Obtain official clearance documents and occupancy permits from all relevant authorities confirming the venue is safe for public operation.<br><b>Resources needed:</b><br><ul><li>Regulatory &amp; Compliance Director</li><li>Legal Counsel</li><li>Operations Manager</li></ul>",
      "start_date": "2027-03-24",
      "duration": 3.0,
      "progress": 0,
      "open": true,
      "meta": "d260ec68-9ab8-4407-9c49-89805361683e FF, 6eee7fd0-b024-4bde-b523-66027ee91b2f FS",
      "parent": "d260ec68-9ab8-4407-9c49-89805361683e"
    },
    {
      "id": "5ef34f05-ce5f-4d20-ae98-2866368345a0",
      "text": "Execute public launch marketing campaign for venue opening",
      "custom_tooltip": "<b>Execute public launch marketing campaign for venue opening</b>",
      "progress": 0,
      "open": true,
      "meta": "1fa30365-74e6-46c7-ac4a-d14d9d2f1d52 FF, d260ec68-9ab8-4407-9c49-89805361683e FS",
      "parent": "1fa30365-74e6-46c7-ac4a-d14d9d2f1d52",
      "type": "project"
    },
    {
      "id": "88c36790-8d61-4695-a665-7159b1b81c46",
      "text": "Finalize creative assets and branding materials",
      "custom_tooltip": "<b>Finalize creative assets and branding materials</b><br>Design promotional visuals, draft press releases, and secure brand guidelines approval for the tactical sport theme.<br><b>Resources needed:</b><br><ul><li>Creative Director</li><li>Graphic Designer</li><li>Copywriter</li><li>Brand Manager</li></ul>",
      "start_date": "2027-03-27",

    {
      "id": "a27592f3-9fe8-4f09-8204-8fc21007e9de",
      "text": "Secure media channels and schedule ad placements",
      "custom_tooltip": "<b>Secure media channels and schedule ad placements</b><br>Negotiate contracts with local digital platforms and traditional outlets to maximize reach before opening day launch.<br><b>Resources needed:</b><br><ul><li>Marketing Manager</li><li>Media Buyer</li><li>Legal Reviewer</li><li>Procurement Specialist</li></ul>",
      "start_date": "2027-04-03",
      "duration": 7.0,

      "meta": "88c36790-8d61-4695-a665-7159b1b81c46 FS",

    {
      "id": "1fc21fda-7a80-4668-82bb-d62fd89913cd",
      "text": "Monitor engagement metrics and adjust spend dynamically",
      "custom_tooltip": "<b>Monitor engagement metrics and adjust spend dynamically</b><br>Track click-through rates daily to optimize budget allocation for maximum customer acquisition during the launch window.<br><b>Resources needed:</b><br><ul><li>Data Analyst</li><li>Social Media Coordinator</li><li>Campaign Manager</li><li>Analytics Tool</li></ul>",

    function zoomFit() {
        const tasks = gantt.getTaskByTime();
        if (tasks.length > 0) {
            const firstTask = tasks[0];
            const lastTask = tasks[tasks.length - 1];
            gantt.showDate(firstTask.start_date);
            
            // Calculate total duration in days
            const startDate = new Date(firstTask.start_date);
            const endDate = new Date(lastTask.end_date);
            const durationDays = (endDate - startDate) / (1000 * 60 * 60 * 24);
            
            // Choose appropriate scale based on duration
            if (durationDays > 3650) { // More than 10 years
                gantt.config.scale_unit = "year";
                gantt.config.step = 10;
                gantt.config.subscales = [
                    {unit: "year", step: 1, date: "%Y"}
                ];
            } else if (durationDays > 365) { // More than 1 year
                gantt.config.scale_unit = "year";
                gantt.config.step = 1;
                gantt.config.subscales = [
                    {unit: "month", step: 1, date: "%M"}
                ];
            } else if (durationDays > 30) { // More than 1 month
                gantt.config.scale_unit = "month";
                gantt.config.step = 1;
                gantt.config.subscales = [
                    {unit: "day", step: 1, date: "%d"}
                ];
            } else if (durationDays > 7) { // More than 1 week
                gantt.config.scale_unit = "week";
                gantt.config.step = 1;
                gantt.config.subscales = [
                    {unit: "day", step: 1, date: "%d"}
                ];
            } else {
                gantt.config.scale_unit = "day";
                gantt.config.step = 1;
                gantt.config.subscales = [];
            }
            gantt.render();
        }
    }

    function zoomIn() {
        const currentUnit = gantt.config.scale_unit;
        const currentStep = gantt.config.step;
        
        if (currentUnit === "year" && currentStep === 10) {
            gantt.config.scale_unit = "year";
            gantt.config.step = 1;
            gantt.config.subscales = [
                {unit: "month", step: 1, date: "%M"}
            ];
        } else if (currentUnit === "year") {
            gantt.config.scale_unit = "month";
            gantt.config.step = 1;
            gantt.config.subscales = [
                {unit: "day", step: 1, date: "%d"}
            ];
        } else if (currentUnit === "month") {
            gantt.config.scale_unit = "week";
            gantt.config.step = 1;
            gantt.config.subscales = [
                {unit: "day", step: 1, date: "%d"}
            ];
        } else if (currentUnit === "week") {
            gantt.config.scale_unit = "day";
            gantt.config.step = 1;
            gantt.config.subscales = [];
        }
        gantt.render();
    }

    function zoomOut() {
        const currentUnit = gantt.config.scale_unit;
        const currentStep = gantt.config.step;
        
        if (currentUnit === "day") {
            gantt.config.scale_unit = "week";
            gantt.config.step = 1;
            gantt.config.subscales = [
                {unit: "day", step: 1, date: "%d"}
            ];
        } else if (currentUnit === "week") {
            gantt.config.scale_unit = "month";
            gantt.config.step = 1;
            gantt.config.subscales = [
                {unit: "day", step: 1, date: "%d"}
            ];
        } else if (currentUnit === "month") {
            gantt.config.scale_unit = "year";
            gantt.config.step = 1;
            gantt.config.subscales = [
                {unit: "month", step: 1, date: "%M"}
            ];
        } else if (currentUnit === "year") {
            gantt.config.scale_unit = "year";
            gantt.config.step = 10;
            gantt.config.subscales = [
                {unit: "year", step: 1, date: "%Y"}
            ];
        }
        gantt.render();
    }

    function downloadCSV() {
        if (GANTT_DATA_CSV === null) {
            return;
        }
        const blob = new Blob([GANTT_DATA_CSV], { type: 'text/csv;charset=utf-8;' });
        const link = document.createElement('a');
        const url = URL.createObjectURL(blob);
        link.setAttribute('href', url);
        link.setAttribute('download', GANTT_FILENAME_CSV);
        link.style.visibility = 'hidden';
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
    }

    // Gantt Initialization
    gantt.config.readonly = true;
    gantt.config.date_format = "%Y-%m-%d";
    gantt.config.scale_unit = "month";
    gantt.config.step = 1;
    gantt.config.subscales = [
        {unit: "day", step: 1, date: "%d"}
    ];

    gantt.config.columns = [
        {name:"text", label:"Task name", width:"*", tree:true},
        // {name:"start_date", label:"Start time", align: "center"},
        // {name:"duration", label:"Duration", align: "center"}
    ];

    gantt.templates.task_class = function(start, end, task) {
        if (task.type === "project") {
            return "project-task";
        }
        return "";
    };

    gantt.templates.tooltip_text = function(start, end, task) {
        return task.custom_tooltip || "No tooltip";
    };
    
	gantt.plugins({
		tooltip: true
	});
	gantt.attachEvent("onGanttReady", function(){
		var tooltips = gantt.ext.tooltips;
		tooltips.tooltip.setViewport(gantt.$task_data);
	});
    gantt.init("gantt_container");
    gantt.parse(GANTT_DATA_DHTMLX);

    // Hide the export to CSV button if there is no CSV data
    if (GANTT_DATA_CSV === null) {
        document.getElementById('exportToCSVButton').style.display = 'none';
    }

    document.getElementById('zoomFitButton').addEventListener('click', zoomFit);
    document.getElementById('zoomInButton').addEventListener('click', zoomIn);
    document.getElementById('zoomOutButton').addEventListener('click', zoomOut);
    document.getElementById('exportToCSVButton').addEventListener('click', downloadCSV);
</script>
